name: 🧬 Pathogen Drift Sentinel MLOps

on:
  schedule:
    # Executes automatically every 5 hours
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surveillance-mlops-sync:
    name: 🧪 CI Gate & 🛰️ Genomic Telemetry Sync
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install MLOps & Bioinformatics Dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Execute Pytest Unit Test Quality Gate
        run: pytest tests/test_pipeline.py -v

      - name: 🚀 Run Bio-Sentinel Engine & Dispatch Discord Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/run_pipeline.sh

      - name: 📊 Commit & Push Parquet, SVG & README Telemetry
        if: success()
        env:
          GH_EMAIL: ${{ secrets.GH_USER_EMAIL }}
          GH_NAME: ${{ secrets.GH_USER_NAME }}
        run: |
          git config user.name "${GH_NAME:-${GITHUB_ACTOR}}"
          git config user.email "${GH_EMAIL:-${GITHUB_ACTOR}@users.noreply.github.com}"
          git add data/ assets/ README.md
          if git diff --staged --quiet; then
            echo "✨ No telemetry changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "🧬 chore(telemetry): automated genomic drift & ML sync [${TIMESTAMP}]"
            git push origin HEAD
          fi
